# rogerwinter.dev — nginx front end  (DEPLOYED on the origin host)
#
# Supersedes deploy/Caddyfile.rogerwinter.snippet. On 2026-09-03 the site moved
# to a host where nginx already owns :443 (it also serves onestreamer.live and
# price.games), so nginx took over both TLS termination and the Cloudflare
# Authenticated Origin Pull check that Caddy's `client_auth` performed.
#
# Installed at /etc/nginx/sites-available/rogerwinter.dev, symlinked into
# sites-enabled. Verify + reload with:  sudo nginx -t && sudo systemctl reload nginx
#
# REDACTED FOR A PUBLIC REPO: real addresses are replaced with ORIGIN_IP,
# OLD_ORIGIN_IP and TAILSCALE_IP. Substitute the real values when installing —
# the origin address lives in the CircleCI `deploy` context as VPS_HOST, and is
# deliberately kept out of this repo because the Authenticated Origin Pull lock
# is only worth something while the origin is not trivially discoverable.
#
#
# Migrated from the sheetllm host (OLD_ORIGIN_IP) on 2026-09-03, where Caddy
# terminated TLS directly. Here nginx owns :443 (it also serves onestreamer.live
# and price.games), so it takes over both TLS termination and the Cloudflare
# Authenticated Origin Pull check that Caddy's `client_auth` performed.
#
#   Cloudflare (proxied, presents origin-pull.cloudflare.net client cert)
#     -> nginx :443  TLS + ssl_verify_client + $cf_origin allowlist
#     -> 127.0.0.1:3005  rwinter-portfolio-web-1 (static site, :8080 internal)
#
# Port note: the source published :3001, which on this host is price-game-app-1
# AND the `tailscale serve` admin route for price.games. See the compose file.
#
# Certificates: /etc/letsencrypt/live/rogerwinter.dev (apex + www), issued by
# DNS-01 through the Cloudflare API. DNS-01 is mandatory, not a preference —
# HTTP-01 and TLS-ALPN-01 cannot work against an origin that requires a client
# certificate, because Let's Encrypt has no way to present one.

# ── Listen-address note ──────────────────────────────────────────────────
# Never write a bare `listen 443` on this host. Every block binds the public IP
# and loopback explicitly so that TAILSCALE_IP:443 stays free for tailscaled,
# which serves the price.games admin panel over the tailnet.

# ── HTTP: redirect (+ ACME webroot as a fallback path) ───────────────────
server {
    listen 80;
    server_name rogerwinter.dev www.rogerwinter.dev new.rogerwinter.dev;

    # Certs come via DNS-01, so this is belt-and-braces only.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: rogerwinter.dev (apex, production) ────────────────────────────
server {
    listen ORIGIN_IP:443 ssl http2;
    listen 127.0.0.1:443 ssl http2;
    server_name rogerwinter.dev;

    ssl_certificate     /etc/letsencrypt/live/rogerwinter.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rogerwinter.dev/privkey.pem;
    include /etc/nginx/snippets/price-games-tls.conf;

    # Cloudflare Authenticated Origin Pull. This MUST stay inside the server
    # block — hoisting it to http{} would make onestreamer.live and price.games
    # demand client certificates from ordinary browsers.
    ssl_client_certificate /etc/nginx/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

    include /etc/nginx/snippets/rwinter-proxy.conf;
}

# ── HTTPS: www.rogerwinter.dev -> apex ───────────────────────────────────
# The source enforced mTLS on the apex but NOT on www; its Caddyfile comments
# recorded that locking www once produced a 525. That note no longer holds:
# on 2026-09-03 a staging hostname (new.rogerwinter.dev, a NON-apex name in this
# zone) was served through the real Cloudflare edge against an mTLS-required
# origin and returned 200, proving Cloudflare does present its origin-pull
# client certificate for non-apex hostnames here. www is therefore locked too,
# closing the gap where anyone who found the origin IP could reach it directly.
server {
    listen ORIGIN_IP:443 ssl http2;
    listen 127.0.0.1:443 ssl http2;
    server_name www.rogerwinter.dev;

    ssl_certificate     /etc/letsencrypt/live/rogerwinter.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rogerwinter.dev/privkey.pem;
    include /etc/nginx/snippets/price-games-tls.conf;

    ssl_client_certificate /etc/nginx/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

    if ($cf_origin = 0) {
        return 403;
    }

    return 301 https://rogerwinter.dev$request_uri;
}
